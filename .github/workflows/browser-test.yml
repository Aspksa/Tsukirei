name: Memory City browser smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  city-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime
        run: npm ci --no-audit --no-fund
      - name: Check browser 3D and full memory city
        run: node tests/browser-smoke.mjs
