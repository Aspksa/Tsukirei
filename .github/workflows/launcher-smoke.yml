name: Windows BAT launcher smoke test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher help and diagnostics
        shell: pwsh
        run: |
          & .\Tsukirei.bat --help
          if ($LASTEXITCODE -ne 0) { throw "Help failed: $LASTEXITCODE" }
          & .\Tsukirei.bat --diagnose
          if ($LASTEXITCODE -ne 0) { throw "Diagnostics failed: $LASTEXITCODE" }
      - name: Check Cyrillic and special-character path
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Цукирэй & тест ! ^ ( ) %'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath '.\Tsukirei.bat' -Destination (Join-Path $dir 'Tsukirei.bat')
          & (Join-Path $dir 'Tsukirei.bat') --diagnose
          if ($LASTEXITCODE -ne 0) { throw "Special path test failed: $LASTEXITCODE" }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start real application from special-character folder
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Цукирэй & тест ! ^ ( ) %'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          foreach ($name in @('Tsukirei.bat', 'package.json', 'package-lock.json')) {
            Copy-Item -LiteralPath (Join-Path $pwd $name) -Destination $dir -Force
          }
          foreach ($name in @('server', 'web')) {
            Copy-Item -LiteralPath (Join-Path $pwd $name) -Destination $dir -Recurse -Force
          }
          $env:TSUKIREI_TEST_LAUNCHER = Join-Path $dir 'Tsukirei.bat'
          $env:TSUKIREI_PORT = '39555'
          $out = Join-Path $env:RUNNER_TEMP 'tsukirei-launch-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'tsukirei-launch-err.txt'
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList '-NoProfile -ExecutionPolicy Bypass -Command "& $env:TSUKIREI_TEST_LAUNCHER --no-open"' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Milliseconds 1000
              $proc.Refresh()
              if ($proc.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/health' -TimeoutSec 2
                if ($health.ok -eq $true -and $health.name -eq 'Tsukirei' -and $health.storage -eq 'postgresql+pgvector') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              Write-Host 'Launcher stdout:'
              if (Test-Path $out) { Get-Content $out -Tail 60 }
              Write-Host 'Launcher stderr:'
              if (Test-Path $err) { Get-Content $err -Tail 60 }
              throw 'BAT did not start the real Tsukirei server'
            }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:39555/' -UseBasicParsing -TimeoutSec 4
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Tsukirei') { throw 'Homepage not served' }
            $script = Invoke-WebRequest -Uri 'http://127.0.0.1:39555/main.js' -UseBasicParsing -TimeoutSec 4
            if ($script.StatusCode -ne 200) { throw 'Frontend script not served' }
            $note = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/notes' -Method Post -ContentType 'application/json' -Body '{"title":"Portable PostgreSQL connected"}' -TimeoutSec 5
            $state = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/state' -TimeoutSec 5
            if ($state.database.connected -ne $true -or $state.notes.Count -ne 1) { throw 'Database writes failed' }
            $knowledge = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/knowledge' -Method Post -ContentType 'application/json' -Body '{"content":"PostgreSQL pgvector Windows portable test","embedding":[1,0,0],"embeddingModel":"smoke-test"}' -TimeoutSec 5
            $similar = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/knowledge/search' -Method Post -ContentType 'application/json' -Body '{"embedding":[1,0,0]}' -TimeoutSec 5
            if ($similar.items.Count -lt 1 -or $similar.items[0].id -ne $knowledge.knowledge.id) { throw 'pgvector search failed' }
            $ragResult = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/rag/search' -Method Post -ContentType 'application/json' -Body '{"query":"Windows portable test"}' -TimeoutSec 10
            if ($ragResult.items.Count -lt 1) { throw 'RAG knowledge retrieval failed' }
            $ragDoc = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/rag/documents' -Method Post -ContentType 'application/json' -Body '{"title":"Portable guide","content":"Portable archive retrieval for Windows","source":"ci.txt"}' -TimeoutSec 10
            if (-not $ragDoc.document.id) { throw 'RAG document import failed' }
            $ragFound = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/rag/search' -Method Post -ContentType 'application/json' -Body '{"query":"archive retrieval"}' -TimeoutSec 10
            if (-not ($ragFound.items | Where-Object { $_.kind -eq 'document' -and $_.id -eq $ragDoc.document.id })) { throw 'RAG document search failed on Windows' }
            $soul = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/soul' -TimeoutSec 10
            if ($soul.settings.address -ne 'хозяин' -or $soul.metrics.chatsObserved -ne 0) { throw 'Soul Engine defaults unavailable' }
            $soulPref = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/soul/preferences' -Method Post -ContentType 'application/json' -Body '{"text":"Portable preferences stay locally"}' -TimeoutSec 10
            if (-not $soulPref.item.id) { throw 'Soul preferences could not be saved' }
            $soulNext = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/soul' -TimeoutSec 10
            if ($soulNext.metrics.confirmedPreferences -ne 1) { throw 'Soul memory was not persisted' }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'data/soul-state.json'))) { throw 'Soul local file was not created' }
            $life = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/living' -TimeoutSec 10
            if ($life.settings.cloudEnabled -ne $false -or $life.budget.calls -ne 0) { throw 'Living Core must start with no paid Cloud.ru calls' }
            $localAnalysis = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/living/run' -Method Post -ContentType 'application/json' -Body '{"cloud":false}' -TimeoutSec 15
            if ($localAnalysis.result.local -ne $true) { throw 'Living Core failed local background reflection' }
            $lifeNext = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/living' -TimeoutSec 10
            if ($lifeNext.metrics.localRuns -lt 1 -or $lifeNext.budget.calls -ne 0) { throw 'Living Core run was not persisted or made paid calls' }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'data/living-state.json'))) { throw 'Living Core local file missing' }
            $cognition = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/cognition' -TimeoutSec 10
            if ($cognition.metrics.scans -lt 1 -or $cognition.worldNodes -lt 0) { throw 'Cognitive Evolution index failed' }
            $goal = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/cognition/goals' -Method Post -ContentType 'application/json' -Body '{"title":"Windows portability","objective":"Confirm goal persistence on Windows with PostgreSQL"}' -TimeoutSec 10
            if (-not $goal.goal.id) { throw 'Cognitive long-term goal was not saved' }
            $goalState = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/cognition/goals' -TimeoutSec 10
            if ($goalState.items.Count -ne 1) { throw 'Cognitive goals not persisted' }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'data/cognitive-state.json'))) { throw 'Cognitive local state missing' }
            $mind = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/supermind' -TimeoutSec 10
            if ($mind.identity.name -ne 'Цукирэй' -or $mind.governor.executesCode -ne $false) { throw 'Supermind identity or safety governor failed' }
            if ($mind.governor.cloudBudget.calls -ne 0) { throw 'Supermind must not make paid Cloud requests' }
            $mindScan = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/supermind/scan' -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 15
            if ($mindScan.status.scanCount -lt 1) { throw 'Supermind autobiography synchronization failed' }
            $mindInquiry = Invoke-RestMethod -Uri 'http://127.0.0.1:39555/api/supermind/inquiries' -Method Post -ContentType 'application/json' -Body '{"question":"Why does local RAG sometimes return no answers?"}' -TimeoutSec 10
            if ($mindInquiry.inquiry.hypotheses.Count -lt 2) { throw 'Supermind hypothesis workflow failed' }
            if (-not (Test-Path -LiteralPath (Join-Path $dir 'data/supermind-state.json'))) { throw 'Supermind local archive not persisted' }
            $config = Get-Content -LiteralPath (Join-Path $dir 'data/portable-postgres.json') -Raw | ConvertFrom-Json
            if (([IO.Path]::GetPathRoot($config.store)) -ne ([IO.Path]::GetPathRoot($dir))) { throw 'Database not stored on the same drive' }
            if ($config.store -notmatch '^[\x20-\x7E]+$') { throw 'Database physical path must be ASCII' }
          } finally {
            try { & taskkill.exe /PID $proc.Id /T /F | Out-Null } catch { }
          }
